name: Sync Substack

on:
  schedule:
    - cron: "0 16 * * *" # every morning at 8 AM PST (4 PM UTC)
  workflow_dispatch: # allow manual trigger from GitHub UI
  push:
    branches: [main]
    paths: # re-run when the sync itself changes
      - .github/workflows/sync-substack.yml
      - scripts/**

permissions:
  contents: write
  actions: write # to trigger the deploy workflow

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync
        env:
          SUBSTACK_RSS_URL: https://hdadhich01.substack.com/feed
          CONTENT_DIR: content/blog
        run: python scripts/sync_substack.py

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "sync: update blog posts from Substack"
            git push
            # Pushes made with GITHUB_TOKEN don't trigger other workflows,
            # so kick off the deploy explicitly.
            gh workflow run hugo.yml --ref main
          fi
